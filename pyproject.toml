[project]
name = "virtual-microscopy"
version = "0.8.0"
description = "Shared digital-twin X-ray and scanning acoustic microscopy workbench"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3", "scipy>=1.14,<2", "pydantic>=2.9,<3", "zarr>=3,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
